<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TipToe Soles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/1.1.0/modern-normalize.min.css"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
     <link rel="stylesheet" href="./css/main.css" />
    <link rel="icon" type="image/png" href="./images/fav.png">
    <link rel="icon" type="image/png" href="/TAFE_HTML-CSS_Project/images/fav.png">
  </head>
  <body>
    <!--Header-->
    <header class="page-header">
      <div class="container">
        <div class="header-navigation">
          <nav class="main-nav">
            <a href="./index.html" class="logo"
              >TipToe<span class="logo-second-color">Soles</span></a
            >
            <ul class="site-nav">
              <li class="link">
                <a href="./index.html" class="site-nav-link">About Us </a>
              </li>
              <li class="link">
                <div class="site-nav-link-thumb">
                  <a href="./shop.html" class="site-nav-link current"
                    >Shop</a
                  >
                </div>
              </li>
              <li class="link">
                <a href="policies.html" class="site-nav-link">Policies</a>
              </li>
            </ul>
          </nav>
          <ul class="cont-nav">
            <li class="link">
              <button type="button" class="cont-nav-link" data-modal-open="login">Log In</button>
            </li>
            <li class="link">
              <button type="button" class="cont-nav-link" data-modal-open="register">Register</button>
            </li>
          </ul>
        </div>
        <button type="button" class="menu-open">
          <svg class="mob-menu-icon-open">
            <use href="./images/symbol-defs.svg#icon-brgr-40px"></use>
          </svg>
        </button>
      </div>
      <div class="mob-menu is-hidden">
        <div class="menu-top">
          <button type="button" class="menu-close">
            <svg class="mob-menu-icon-close">
              <use href="./images/symbol-defs.svg#icon-close-btn-40px"></use>
            </svg>
          </button>
          <ul class="mob-menu-list">
            <li class="mob-menu-item">
              <a class="mob-menu-link" href="./index.html">About Us</a>
            </li>
            <li class="mob-menu-item">
              <a class="mob-menu-link current" href="./shop.html">Shop</a>
            </li>
            <li class="mob-menu-item">
              <a class="mob-menu-link" href="./policies.html">Policies</a>
            </li>
          </ul>
        </div>
        <div class="menu-bottom">
          <div class="mob-menu-contacts">
            <button type="button" class="mob-menu-mail" data-modal-open="login">Log In</button>
            <button type="button" class="mob-menu-mail" data-modal-open="register">Register</button>
          </div>
          <ul class="mob-social-list">
            <li class="mob-social-item">
              <a class="mob-social-link" href="">Instagram</a>
            </li>
            <li class="mob-social-item">
              <a class="mob-social-link" href="">Twitter</a>
            </li>
            <li class="mob-social-item">
              <a class="mob-social-link" href="">Facebook</a>
            </li>
            <li class="mob-social-item">
              <a class="mob-social-link" href="">LinkedIn</a>
            </li>
          </ul>
        </div>
      </div>
    </header>
    <!--Main-->
    <main>
      <section class="shop">
        <!--Shop List-->
        <div class="container">
          <ul class="shop-list"></ul>
        </div>
      </section>
    </main>
    <!--Footer-->
    <footer class="page-footer">
      <div class="container">
        <div class="footer-common">
          <div class="tab-position">
            <div class="address-left">
              <a href="./index.html" class="logo"
                >TipToe<span class="logo-second-color-footer">Soles</span></a
              >
              <address class="address-list">
                <p class="address">322 Avondale Road Enfield NSW 2133</p>
                <ul class="contacts">
                  <li class="contact-list">
                    <a class="contacts-link" href="mailto:TipToeShoes@gmail.com"
                      >TipToeShoes@gmail.com</a
                    >
                  </li>
                  <li class="contact-list">
                    <a class="contacts-link" href="tel:0292105000"
                      >0292105000</a
                    >
                  </li>
                </ul>
              </address>
            </div>
            <div class="join">
              <p class="join__txt">join us</p>
              <ul class="join__social-media">
                <li class="social-media__link">
                  <a href="" class="social-media__icon" aria-label="Instagram">
                    <svg class="social-media__img">
                      <use
                        href="./images/symbol-defs.svg#icon-instagram-logo"
                      ></use>
                    </svg>
                  </a>
                </li>
                <li class="social-media__link">
                  <a href="" class="social-media__icon" aria-label="Twitter">
                    <svg class="social-media__img">
                      <use
                        href="./images/symbol-defs.svg#icon-twitter-logo"
                      ></use>
                    </svg>
                  </a>
                </li>
                <li class="social-media__link">
                  <a href="" class="social-media__icon" aria-label="Facebook">
                    <svg class="social-media__img">
                      <use
                        href="./images/symbol-defs.svg#icon-facebook-logo"
                      ></use>
                    </svg>
                  </a>
                </li>
                <li class="social-media__link">
                  <a href="" class="social-media__icon" aria-label="LinkedIn">
                    <svg class="social-media__img">
                      <use
                        href="./images/symbol-defs.svg#icon-linkedin-logo"
                      ></use>
                    </svg>
                  </a>
                </li>
              </ul>
            </div>
          </div>
          <div class="subscribe">
            <form name="signup_form" autocomplete="on" novalidate>
              <div class="subscription-field">
                <label class="subscribe-text">
                  Subscribe to Newsletter
                  <input
                          class="subscription-form"
                          type="email"
                          name="email"
                          placeholder="E-mail"
                  />
                </label>
                <button class="subscription-btn" type="submit">
                  Subscribe
                  <div class="icon-send">
                    <svg class="icon-send-img">
                      <use href="./images/symbol-defs.svg#icon-send"></use>
                    </svg>
                  </div>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </footer>
    <!-- login modal -->
    <div class="backdrop is-hidden" data-modal="login">
      <div class="modal modal-login">
        <button class="modal-button-close" data-modal-close="login">
          <svg class="icon-close-img">
            <use href="./images/symbol-defs.svg#icon-close-black"></use>
          </svg>
        </button>
        <p class="modal-title">Log In</p>
        <form class="subscribe-form">
          <div class="main-form">
            <div class="form-field">
              <label class="form-field-name" for="login-email">Email</label>
              <span class="input-wrap">
                <input type="email" name="email" id="login-email" class="modal-input" />
                <svg class="modal-input-icon" width="18" height="18">
                  <use href="./images/symbol-defs.svg#icon-email-black"></use>
                </svg>
              </span>
            </div>
            <div class="form-field">
              <label class="form-field-name" for="login-password">Password</label>
              <input type="password" name="password" id="login-password" class="modal-input modal-input-no-icon" />
            </div>
          </div>
          <div class="submit-btn">
            <button class="submit-button" type="submit">Log In</button>
          </div>
        </form>
      </div>
    </div>

    <!-- register modal -->
    <div class="backdrop is-hidden" data-modal="register">
      <div class="modal modal-register">
        <button class="modal-button-close" data-modal-close="register">
          <svg class="icon-close-img">
            <use href="./images/symbol-defs.svg#icon-close-black"></use>
          </svg>
        </button>
        <p class="modal-title">Create an Account</p>
        <form class="subscribe-form">
          <div class="main-form">
            <div class="form-field">
              <label class="form-field-name" for="register-name">Name</label>
              <span class="input-wrap">
                <input type="text" name="name" id="register-name" class="modal-input" />
                <svg class="modal-input-icon" width="18" height="18">
                  <use href="./images/symbol-defs.svg#icon-person-black"></use>
                </svg>
              </span>
            </div>
            <div class="form-field">
              <label class="form-field-name" for="register-email">Email</label>
              <span class="input-wrap">
                <input type="email" name="email" id="register-email" class="modal-input" />
                <svg class="modal-input-icon" width="18" height="18">
                  <use href="./images/symbol-defs.svg#icon-email-black"></use>
                </svg>
              </span>
            </div>
            <div class="form-field">
              <label class="form-field-name" for="register-password">Password</label>
              <input type="password" name="password" id="register-password" class="modal-input modal-input-no-icon" />
            </div>
          </div>
          <div class="submit-btn">
            <button class="submit-button" type="submit">Register</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./js/products.js"></script>
    <script src="./js/modal.js"></script>
    <script src="./js/menu.js"></script>
    <script src="./js/validation.js"></script>
  </body>
</html>
